name: keepalive
on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping atlasdata
        run: |
          for p in /healthz /gw/api/price/BTC?gk=d55c89a7b7668e8b5eaf7b6b32b9a9c0a2d5b22d076d6032; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "https://x402atlas.xyz$p")
            echo "$p -> $code"
          done
